name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: amd64
            docker-platform: linux/amd64
          - platform: ubuntu-22.04
            arch: arm64
            docker-platform: linux/arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build in Docker
        run: |
          docker run --rm \
            --platform ${{ matrix.docker-platform }} \
            -v $(pwd):/workspace \
            -w /workspace \
            debian:10-slim \
            bash -c "
              set -e
          
              apt-get update && \
              apt-get install -y curl wget git file build-essential pkg-config \
                libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev \
                libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils && \
          
              # 装 Node 18（或 20，看你需求）
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && \
              apt-get install -y nodejs && \
          
              # 装 Rust
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && \
              . \$HOME/.cargo/env && \
          
              corepack enable && \
              corepack prepare pnpm@9 --activate && \
              npm install -g pnpm
              pnpm install --frozen-lockfile && \
              pnpm build:pro
            "


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linglong-store-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  create-release:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: '玲珑应用商店 v${{ github.ref_name }}'
          body: |
            ## 玲珑应用商店 ${{ github.ref_name }}
            
            ### 下载安装
            请根据您的 Linux 发行版和 CPU 架构选择对应的安装包：
            
            #### x86_64 (AMD64)
            - 🔹 `*-amd64.AppImage` - 通用格式，下载后添加可执行权限即可运行
            - 🔹 `*_amd64.deb` - 适用于 Debian/Ubuntu/Deepin 等发行版
            - 🔹 `*-amd64.rpm` - 适用于 Fedora/openSUSE/UOS 等发行版
            
            #### ARM64 (aarch64)
            - 🔹 `*-arm64.AppImage` - 通用格式，下载后添加可执行权限即可运行
            - 🔹 `*_arm64.deb` - 适用于 Debian/Ubuntu/Deepin 等发行版
            - 🔹 `*-arm64.rpm` - 适用于 Fedora/openSUSE/UOS 等发行版
            
            ### 系统要求
            - Linux 操作系统（支持 x86_64 和 ARM64）
            - 已安装玲珑包管理器 (ll-cli)
            - GTK 3.0+
            - WebKit2GTK 4.1+
            
            ### 更新日志
            详见 [CHANGELOG](https://github.com/SXFreell/linglong-store/releases/tag/${{ github.ref_name }})
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
